server.port=8080
spring.application.name=storex-demo
# Ho tro ca Spring Datasource (bai 1/2/5) va DB_HOST/DB_USER/DB_PASS (bai 3)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:storex_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASS:secret}}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
management.endpoints.web.exposure.include=health,info
management.health.redis.enabled=${STOREX_ENABLE_REDIS:false}
