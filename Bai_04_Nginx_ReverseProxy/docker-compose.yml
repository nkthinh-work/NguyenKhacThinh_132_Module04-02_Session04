services:
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - product_service
    networks:
      - storex-proxy-net

  user_service:
    build:
      context: ../storex-demo/mock-service
    image: storex-user:latest
    environment:
      SERVICE_NAME: user_service
      SERVICE_PORT: "8081"
    expose:
      - "8081"
    networks:
      - storex-proxy-net

  product_service:
    build:
      context: ../storex-demo/mock-service
    image: storex-product:latest
    environment:
      SERVICE_NAME: product_service
      SERVICE_PORT: "8082"
    expose:
      - "8082"
    networks:
      - storex-proxy-net

networks:
  storex-proxy-net:
    driver: bridge
