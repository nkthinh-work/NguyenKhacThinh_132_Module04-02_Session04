server {
    listen 80;
    server_name _;

    # Proxy path co dau / cuoi: /users/profile -> upstream /profile
    location /users/ {
        proxy_pass http://user_service:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /products/ {
        proxy_pass http://product_service:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /users { return 301 /users/; }
    location = /products { return 301 /products/; }
    location / { return 200 'StoreX reverse proxy: /users/ or /products/'; }
}
