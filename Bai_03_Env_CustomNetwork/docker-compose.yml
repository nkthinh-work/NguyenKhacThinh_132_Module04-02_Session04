services:
  backend:
    build:
      context: ../storex-demo/backend
    image: storex-backend:v3
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-storex_db}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    networks:
      - storex-net
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: ${DB_NAME:-storex_db}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - storex_pgdata:/var/lib/postgresql/data
    # Khong publish 5432 ra host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - storex-net

networks:
  storex-net:
    driver: bridge

volumes:
  storex_pgdata:
